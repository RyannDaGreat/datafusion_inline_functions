[package]
name = "datafusion_inline_functions"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Query-local SQL expression functions expanded for Apache DataFusion"
repository = "https://github.com/RyannDaGreat/datafusion_inline_functions"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28", features = ["abi3-py311"], optional = true }
sqlparser = { version = "=0.62.0", features = ["visitor"] }
thiserror = "2"

[features]
default = ["python"]
python = ["dep:pyo3"]

[profile.release]
lto = "thin"
strip = true
